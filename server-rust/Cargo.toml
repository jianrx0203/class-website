[package]
name = "class-website-server"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = { version = "4", features = ["compress-gzip"] }
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
env_logger = "0.10"
log = "0.4"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
